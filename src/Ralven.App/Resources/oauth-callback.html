<!doctype html>
<html lang="{culture}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Ralven</title>
  <style>
    :root {
      color-scheme: dark;
      --canvas: #0A0A0B;
      --canvas-deep: #111214;
      --text: #FFFFFF;
      --text-muted: #A6A7AC;
      --accent: #FFFFFF;
      --success: #32D583;
      --success-surface: #10271F;
      --danger: #F04438;
      --danger-surface: #2B1518;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 24px;
      overflow: hidden;
      background:
        radial-gradient(circle at 10% 100%, rgba(255, 255, 255, .12) 0, rgba(166, 167, 172, .06) 28%, transparent 58%),
        linear-gradient(145deg, var(--canvas) 0, var(--canvas-deep) 72%);
      color: var(--text);
      font-family: "Inter", "Segoe UI Variable Text", "Segoe UI", sans-serif;
      text-align: center;
    }

    .brand {
      position: fixed;
      top: 32px;
      left: 32px;
      display: flex;
      align-items: center;
      gap: 11px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -.01em;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(3, 5, 10, .40);
    }

    .brand-reg {
      position: relative;
      top: -.45em;
      margin-left: 2px;
      color: var(--text-muted);
      font-size: 8px;
      line-height: 1;
    }

    main { width: min(100%, 520px); }

    .result { padding: 28px 12px; }

    .status-mark {
      position: relative;
      display: block;
      width: 60px;
      height: 60px;
      margin: 0 auto 26px;
      border-radius: 16px;
    }

    .result--success .status-mark { background: var(--success-surface); }
    .result--error .status-mark { background: var(--danger-surface); }

    .result--success .status-mark::after {
      content: "";
      position: absolute;
      top: 21px;
      left: 18px;
      width: 24px;
      height: 18px;
      background: var(--success);
      clip-path: polygon(0 42%, 12% 31%, 40% 62%, 88% 9%, 100% 22%, 40% 100%);
    }

    .result--error .status-mark::before,
    .result--error .status-mark::after {
      content: "";
      position: absolute;
      top: 28px;
      left: 18px;
      width: 24px;
      height: 3px;
      border-radius: 2px;
      background: var(--danger);
    }

    .result--error .status-mark::before { transform: rotate(45deg); }
    .result--error .status-mark::after { transform: rotate(-45deg); }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 34px);
      line-height: 1.18;
      font-weight: 650;
      letter-spacing: -.03em;
    }

    p {
      max-width: 38ch;
      margin: 13px auto 0;
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
    }

    ::selection {
      background: var(--accent);
      color: #0A0A0B;
    }

    @media (max-width: 520px) {
      body { padding: 88px 20px 28px; }
      .brand { top: 24px; left: 24px; }
      .result { padding-inline: 0; }
    }
  </style>
</head>
<body>
  <div class="brand" aria-label="Ralven">
    {icon}
    <span>Ralven</span>
  </div>
  <main>{body}</main>
</body>
</html>
