## Ralven anonymous telemetry + admin dashboard API Worker.
##
## Receives the same closed-allowlist telemetry event already documented in
## docs/telemetry.md, validates it server-side (never trusting client-side
## validation alone), and stores it in D1. Also serves the authenticated
## /api/stats/* endpoints the dashboard (infra/dashboard/) reads from, and
## the custom admin login/logout used to protect them.
##
## DEPLOYED: a single Worker instance (this top-level, unnamed environment)
## handles both Development- and Production-tagged telemetry -- the
## `environment` column on each row is what separates them for the
## dashboard's filters, not a second deployed Worker. An earlier design
## proposed `env.development`/`env.production` named-environment sections
## (mirroring how Sentry environments work), but that turned out to add no
## real benefit here, since D1 already distinguishes rows by that column;
## they were removed. `wrangler deploy` (no --env) is what is actually live
## at:
##   https://api.vemryx.com
##
## The .NET client is fully wired to send both anonymous telemetry
## (`POST /telemetry`) and bug reports (`POST /bugs`) to this Worker.
## FormSubmit was removed entirely as a transport for both; there is no
## fallback if this Worker is unreachable. Bug reports are text-only -- no
## attachment/screenshot support, no R2 dependency (dropped after R2 turned
## out to require an account-level activation step in the Cloudflare
## Dashboard that couldn't be done from this environment; see README.md).
##
## Required secrets (already set on the deployed Worker via
## `wrangler secret put <NAME>`, NEVER written to this file or committed):
##   ADMIN_PASSWORD_HASH -- output of `npm run hash-admin-password`
##   IP_HASH_SECRET      -- a long random string, used only to keep
##                          brute-force tracking from storing a raw IP
##   ADMIN_CSRF_SECRET   -- a distinct long random string for session-bound
##                          CSRF tokens
##   ASAAS_ACCESS_TOKEN -- server-only production API key for checkout,
##                         cancellation and canonical reads
##   ASAAS_WEBHOOK_TOKEN -- distinct 32-255 character token sent by Asaas in
##                          the asaas-access-token header
##   OPENAI_API_KEY -- credencial server-side usada somente por POST /ai/message
##   RALVEN_AI_SAFETY_IDENTIFIER_SECRET -- segredo distinto usado para derivar
##                          identificadores opacos; nunca enviado ao provedor
##   FIREBASE_WEB_API_KEY -- validates pending MFA credentials
##   FIREBASE_ADMIN_CLIENT_EMAIL -- least-privilege service account identity
##   FIREBASE_ADMIN_PRIVATE_KEY -- PKCS#8 service account private key
##   MFA_RECOVERY_CODE_HMAC_SECRET -- distinct random secret (32+ characters)
##                          for recovery-code and lookup HMACs
##   RALVEN_DISCORD_BOT_SECRET -- distinct random secret (32+ characters)
##                          shared only with the official Discord bot
##
## DASHBOARD_ORIGIN below is a plain, non-secret var -- the exact comma-separated
## origins the dashboard is served from, so CORS headers are only ever sent back
## to that allowlist. Safe to commit (it is not a credential). For local testing,
## override it per-machine in a git-ignored `.dev.vars` file instead of
## editing this one -- see README.md.
##
## See README.md for the full setup walkthrough.

# External Cloudflare resource identifiers intentionally remain unchanged.
# Renaming these values would provision unrelated resources instead of
# rebranding the deployed Ralven service.
name = "fivemcleaner-telemetry"
main = "src/index.js"
compatibility_date = "2026-08-11"
# The configured custom domain api.vemryx.com is the only public Worker
# origin. Keep the historical Worker name for its already-provisioned D1
# resources, but do not expose it through a fivemcleaner-*.workers.dev URL.
workers_dev = false

[triggers]
crons = ["*/15 * * * *"]

[vars]
ASAAS_BILLING_ENABLED = "false"
ASAAS_ENVIRONMENT = "production"
ASAAS_AMOUNT_CENTS = "1990"
ASAAS_RETURN_URL = "https://api.vemryx.com/billing/return"
DASHBOARD_ORIGIN = "https://dashboard.vemryx.com"
RALVEN_AI_MODEL = "gpt-5.6-luna"
# A chave sozinha não ativa a rota. Revise tudo e altere explicitamente no deploy.
RALVEN_AI_ENABLED = "false"
# Tetos fail-closed da V1. US$0,25 equivale ao teto de R$1,50 com câmbio contábil de R$6/US$.
RALVEN_AI_USER_MONTHLY_BUDGET_MICROUSD = "250000"
RALVEN_AI_GLOBAL_MONTHLY_BUDGET_MICROUSD = "20000000"
RALVEN_AI_RESERVED_COST_MICROUSD = "20000"
# Preços do modelo acima em 2026-09-08; atualizar junto com uma mudança de modelo/preço.
RALVEN_AI_INPUT_PRICE_MICROUSD_PER_MILLION = "200000"
RALVEN_AI_CACHED_INPUT_PRICE_MICROUSD_PER_MILLION = "20000"
RALVEN_AI_CACHE_WRITE_PRICE_MICROUSD_PER_MILLION = "250000"
RALVEN_AI_OUTPUT_PRICE_MICROUSD_PER_MILLION = "1200000"

[[ratelimits]]
name = "BILLING_WRITE_LIMITER"
namespace_id = "1006"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "BILLING_READ_LIMITER"
namespace_id = "1007"
simple = { limit = 20, period = 60 }

# Mandatory per-UID budget shared by authenticated /account routes.
[[ratelimits]]
name = "ACCOUNT_ROUTE_LIMITER"
namespace_id = "1009"
simple = { limit = 60, period = 60 }

# The opaque pending credential is HMACed before it becomes the limiter key.
[[ratelimits]]
name = "ACCOUNT_RECOVERY_LIMITER"
namespace_id = "1010"
simple = { limit = 5, period = 60 }

[[d1_databases]]
binding = "TELEMETRY_DB"
database_name = "fivemcleaner-telemetry"
database_id = "fe276121-a71a-4ba4-ab62-81cccdf601c6"

## Per-IP budget for GET /account/username-available, the one route that
## reaches D1 without any authentication. 20 lookups per 60s is far above
## what the registration form's debounced typing produces (one request per
## pause, per user) and far below what a useful enumeration sweep needs.
##
## The binding is optional at runtime -- see src/rateLimit.js. `wrangler dev`
## and the unit tests run without it and the route stays open.
[[ratelimits]]
name = "USERNAME_LOOKUP_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

## Public write routes use required fail-closed bindings. If a binding is
## missing or unavailable, the Worker rejects the write instead of silently
## exposing D1 to an unbounded request stream.
[[ratelimits]]
name = "TELEMETRY_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "BUG_REPORT_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[[ratelimits]]
name = "UPDATER_EVENT_LIMITER"
namespace_id = "1004"
simple = { limit = 60, period = 60 }

## Advisory per-IP budget for GET /live-alert, the same fail-open trade as
## USERNAME_LOOKUP_LIMITER above: read-only, no auth, and every installed app
## polls it at startup plus once an hour, so this only guards against abuse,
## not normal traffic.
[[ratelimits]]
name = "LIVE_ALERT_LIMITER"
namespace_id = "1005"
simple = { limit = 30, period = 60 }

# Aplicado por Firebase UID depois da validação do token. Ausência ou falha
# do binding bloqueia a rota para não expor custo ilimitado ao provedor.
[[ratelimits]]
name = "RALVEN_AI_LIMITER"
namespace_id = "1008"
simple = { limit = 10, period = 60 }
