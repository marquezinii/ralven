name: Build installer and publish release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact stable tag to build (vX.Y.Z)
        required: true
        type: string
      publish:
        description: Publish after the protected signing and production approvals
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

jobs:
  build_audit:
    name: Audit clean source
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      asset_version: ${{ steps.release.outputs.asset_version }}
      trusted_commit: ${{ steps.release.outputs.trusted_commit }}

    steps:
      - name: Checkout exact tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate stable tag and trusted source
        id: release
        shell: pwsh
        run: |
          . ./scripts/Installer.Common.ps1
          $version = Get-ProjectVersion -Workspace (Get-Location).Path
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Directory.Build.props Version must be numeric SemVer: $version"
          }

          $expectedTag = "v$version"
          if ($env:RELEASE_TAG -ne $expectedTag) {
            throw "Stable tag mismatch. Expected '$expectedTag', got '$env:RELEASE_TAG'."
          }

          ./scripts/Test-PublicVersionProgression.ps1 -Version $version

          $tagCommit = (git rev-parse "$env:RELEASE_TAG^{commit}").Trim()
          $headCommit = (git rev-parse HEAD).Trim()
          if ($tagCommit -ne $headCommit) {
            throw 'Checked out commit does not match the requested tag.'
          }
          # Secret-bearing jobs must never run code selected only by an
          # arbitrary tag. Require the tag to identify current origin/main.
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not resolve the trusted origin/main release commit.'
          }
          $trustedMainCommit = (git rev-parse refs/remotes/origin/main).Trim()
          if ($tagCommit -ne $trustedMainCommit) {
            throw 'Stable release tag must point to the current origin/main commit.'
          }
          if (git status --porcelain=v1 --untracked-files=all) {
            throw 'Release checkout is not clean.'
          }

          "asset_version=$version" >> $env:GITHUB_OUTPUT
          "trusted_commit=$tagCommit" >> $env:GITHUB_OUTPUT

      - name: Safety verification and build
        shell: pwsh
        run: |
          ./scripts/Test-RepositoryPolicy.ps1
          ./scripts/Sync-Localization.ps1 -Mode Check
          ./scripts/Verify-Safety.ps1 -SkipTests
          # Execute the xUnit v3 app directly; the .NET 10 test server reports zero tests here.
          dotnet run --project tests/Ralven.Tests/Ralven.Tests.csproj `
            --configuration Release `
            --no-build `
            -- `
            --minimum-expected-tests 1

  sign_release:
    name: Build, protect, validate and sign release
    needs: build_audit
    runs-on: windows-latest
    timeout-minutes: 45
    # Configure this GitHub Environment with required reviewers. Its secrets
    # are online CI keys, never an offline root or an Authenticode credential.
    environment: release-signing

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build_audit.outputs.trusted_commit }}

      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Write Google sign-in overlay
        shell: pwsh
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # This desktop credential necessarily ships with the app. Keeping
          # its overlay in the protected build environment prevents accidental
          # source commits; PKCE, not this embedded value, protects the flow.
          if ([string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_ID) -or
              [string]::IsNullOrWhiteSpace($env:GOOGLE_OAUTH_CLIENT_SECRET)) {
            throw 'Google OAuth desktop credentials are required to build the public installer.'
          }
          $overlay = [ordered]@{
            googleOAuthClientId     = $env:GOOGLE_OAUTH_CLIENT_ID
            googleOAuthClientSecret = $env:GOOGLE_OAUTH_CLIENT_SECRET
          }
          $overlay | ConvertTo-Json | Set-Content -LiteralPath ./src/Ralven.App/Config/appsettings.Production.local.json -Encoding utf8

      - name: Build hardened self-contained package and installer
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        # Raw symbol maps exist only inside this protected job. No clean
        # candidate can cross into signing or publication.
        run: ./scripts/Build-Installer.ps1 -Version $env:ASSET_VERSION -Harden

      - name: Build release signer without secrets
        shell: pwsh
        run: dotnet build ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj --configuration Release

      - name: Sign broker integrity manifest
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
          BROKER_INTEGRITY_SIGNING_PASSWORD: ${{ secrets.BROKER_INTEGRITY_SIGNING_PASSWORD }}
          BROKER_INTEGRITY_SIGNING_PRIVATE_KEY: ${{ secrets.BROKER_INTEGRITY_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BROKER_INTEGRITY_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:BROKER_INTEGRITY_SIGNING_PASSWORD)) {
            throw 'The protected signing environment requires the broker integrity signing key.'
          }
          $privateKey = Join-Path $env:RUNNER_TEMP 'ralven-broker-private.pem'
          try {
            [IO.File]::WriteAllText($privateKey, $env:BROKER_INTEGRITY_SIGNING_PRIVATE_KEY, [Text.UTF8Encoding]::new($false))
            $env:RALVEN_SIGNING_PASSWORD = $env:BROKER_INTEGRITY_SIGNING_PASSWORD
            $versionRoot = "./artifacts/Ralven-win-x64/Runtime/versions/$env:ASSET_VERSION"
            dotnet run --project ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj --configuration Release --no-build -- `
              sign-broker "$versionRoot/broker/SHA256SUMS.txt" $env:ASSET_VERSION $privateKey "$versionRoot/broker-integrity.json"
            if ($LASTEXITCODE -ne 0) { throw 'Signing the broker integrity manifest failed.' }
            dotnet run --project ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj --configuration Release --no-build -- `
              verify-broker "$versionRoot/broker-integrity.json" ./src/Ralven.App/Assets/broker-integrity-public-key.pem
            if ($LASTEXITCODE -ne 0) { throw 'The broker manifest does not match the embedded broker key.' }
          }
          finally { if (Test-Path -LiteralPath $privateKey) { Remove-Item -LiteralPath $privateKey -Force } }

      - name: Repackage signed broker and validate runtime
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          ./scripts/Finalize-BrokerIntegrity.ps1 -Version $env:ASSET_VERSION
          $installer = Resolve-Path "./artifacts/installer/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe"
          ./scripts/Test-NoUnobfuscatedAssemblies.ps1 `
            -RuntimeDirectory ./artifacts/Ralven-win-x64 `
            -Version $env:ASSET_VERSION `
            -PortableZipPath ./artifacts/Ralven-win-x64.zip `
            -RuntimeZipPath ./artifacts/Ralven-Runtime-win-x64.zip `
            -InstallerPath $installer
          ./scripts/Test-HardenedRuntime.ps1 -RuntimeDirectory ./artifacts/Ralven-win-x64 -Version $env:ASSET_VERSION
          ./scripts/Test-Installer.ps1 -InstallerPath $installer -PublishDirectory ./artifacts/Ralven-win-x64 -ExpectedVersion $env:ASSET_VERSION

      - name: Encrypt private obfuscation maps
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
          OBFUSCATION_MAP_ENCRYPTION_KEY: ${{ secrets.OBFUSCATION_MAP_ENCRYPTION_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:OBFUSCATION_MAP_ENCRYPTION_KEY)) {
            throw 'The protected signing environment requires the obfuscation-map encryption key.'
          }
          ./scripts/Protect-ObfuscationMaps.ps1 `
            -MappingDirectory ./artifacts/obfuscation-maps `
            -OutputPath "./artifacts/Ralven-obfuscation-maps-$env:ASSET_VERSION.bin" `
            -EncryptionKey $env:OBFUSCATION_MAP_ENCRYPTION_KEY
          Remove-Item -LiteralPath ./artifacts/obfuscation-maps -Recurse -Force

      - name: Stage and sign release assets
        shell: pwsh
        env:
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
          # The existing GitHub secret protects the unchanged signing trust
          # anchor. Map it to the Ralven runtime variable so the repository
          # rename does not require exposing or re-entering that secret.
          RALVEN_SIGNING_PASSWORD: ${{ secrets.FIVEMCLEANER_SIGNING_PASSWORD }}
          RELEASE_SIGNING_PRIVATE_KEY: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path ./artifacts/release | Out-Null
          Copy-Item -LiteralPath "./artifacts/installer/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe.sha256" -Destination ./artifacts/release
          Copy-Item -LiteralPath "./artifacts/installer/Ralven-release-manifest-$env:ASSET_VERSION.json" -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/Ralven-win-x64.zip -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/Ralven-win-x64.zip.sha256 -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/Ralven-Runtime-win-x64.zip -Destination ./artifacts/release
          Copy-Item -LiteralPath ./artifacts/Ralven-Runtime-win-x64.zip.sha256 -Destination ./artifacts/release

          if ([string]::IsNullOrWhiteSpace($env:RELEASE_SIGNING_PRIVATE_KEY) -or
              [string]::IsNullOrWhiteSpace($env:RALVEN_SIGNING_PASSWORD)) {
            throw 'Stable releases require the protected update-manifest signing key.'
          }
          $privateKey = Join-Path $env:RUNNER_TEMP 'ralven-release-private.pem'
          try {
            [IO.File]::WriteAllText(
              $privateKey,
              $env:RELEASE_SIGNING_PRIVATE_KEY,
              [Text.UTF8Encoding]::new($false))
            $minimum = (Get-Content -LiteralPath ./installer/minimum-update-version.txt -Raw).Trim()
            $runtimeUrl = "https://vemryx.com/Ralven/releases/$env:RELEASE_TAG/Ralven-Runtime-$env:ASSET_VERSION-win-x64.zip"
            $installerUrl = "https://vemryx.com/Ralven/releases/$env:RELEASE_TAG/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe"
            $runtimeManifest = './artifacts/release/Ralven-runtime-update-manifest.json'
            $installerManifest = './artifacts/release/Ralven-installer-update-manifest.json'
            dotnet run --project ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj `
              --configuration Release --no-build -- `
              sign ./artifacts/Ralven-Runtime-win-x64.zip stable $env:ASSET_VERSION `
              $minimum $runtimeUrl $privateKey $runtimeManifest
            if ($LASTEXITCODE -ne 0) { throw 'Signing the runtime manifest failed.' }
            dotnet run --project ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj `
              --configuration Release --no-build -- `
              sign "./artifacts/installer/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe" stable $env:ASSET_VERSION `
              $minimum $installerUrl $privateKey $installerManifest
            if ($LASTEXITCODE -ne 0) { throw 'Signing the installer manifest failed.' }
            foreach ($manifest in @($runtimeManifest, $installerManifest)) {
              dotnet run --project ./src/Ralven.ReleaseTool/Ralven.ReleaseTool.csproj `
                --configuration Release --no-build -- `
                verify $manifest ./src/Ralven.App/Assets/update-manifest-public-key.pem $minimum
              if ($LASTEXITCODE -ne 0) { throw "Signed manifest '$manifest' does not match the embedded public key." }
            }
          }
          finally {
            if (Test-Path -LiteralPath $privateKey) { Remove-Item -LiteralPath $privateKey -Force }
          }
          Copy-Item `
            -LiteralPath "./artifacts/installer/Ralven-Setup-$env:ASSET_VERSION-win-x64.exe" `
            -Destination ./artifacts/release/Ralven-Setup-latest-win-x64.exe

          ./scripts/New-ReleaseNotes.ps1 `
            -Version $env:ASSET_VERSION `
            -OutputPath ./artifacts/release/RELEASE_NOTES.md

      - name: Upload signed release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ralven-signed-${{ needs.build_audit.outputs.asset_version }}
          path: artifacts/release/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload encrypted diagnostic maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Ralven-protected-maps-${{ needs.build_audit.outputs.asset_version }}
          path: artifacts/Ralven-obfuscation-maps-${{ needs.build_audit.outputs.asset_version }}.bin
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Publish release
    if: ${{ github.event_name == 'push' || inputs.publish }}
    needs: [build_audit, sign_release]
    runs-on: windows-latest
    timeout-minutes: 15
    # Required reviewers are configured on this GitHub Environment; the job
    # cannot create a public release or deploy production before approval.
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout release infrastructure
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build_audit.outputs.trusted_commit }}

      - name: Download audited candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Ralven-signed-${{ needs.build_audit.outputs.asset_version }}
          path: release

      - name: Download encrypted diagnostic maps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Ralven-protected-maps-${{ needs.build_audit.outputs.asset_version }}
          path: protected-maps

      - name: Setup Node.js from .node-version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: infra/cloudflare-worker/package-lock.json

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*-Setup-*-win-x64.exe

      - name: Prepare production diagnostics backend
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare credentials are required to prepare production diagnostics.'
          }
          Push-Location ./infra/cloudflare-worker
          try {
            npm ci
            $schemaQuery = @'
          SELECT
            EXISTS(SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'telemetry_events') AS has_schema,
            EXISTS(SELECT 1 FROM sqlite_master WHERE type = 'table' AND name = 'd1_migrations') AS has_ledger,
            EXISTS(SELECT 1 FROM pragma_table_info('telemetry_events') WHERE name = 'process_count_at_start') AS has_v5_telemetry,
            EXISTS(SELECT 1 FROM pragma_table_info('account_profiles') WHERE name = 'terms_version') AS has_profile_terms;
          '@
            $schemaQuery = ($schemaQuery -replace '[\r\n]+', ' ').Trim()
            $schemaState = npx.cmd wrangler d1 execute fivemcleaner-telemetry --remote --command $schemaQuery --json | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0) { throw 'Inspecting the telemetry schema failed.' }
            $state = $schemaState[0].results[0]
            if ($state.has_schema -and -not $state.has_ledger) {
              if (-not $state.has_v5_telemetry -or -not $state.has_profile_terms) {
                throw 'The legacy telemetry schema cannot be adopted because it is not at the known bootstrap version.'
              }
              $adoptionQuery = @'
          CREATE TABLE IF NOT EXISTS d1_migrations (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            name TEXT UNIQUE,
            applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL
          );
          INSERT OR IGNORE INTO d1_migrations (name) VALUES
            ('0000_initial_schema.sql'),
            ('0001_account_username_terms.sql'),
            ('0002_account_profiles.sql'),
            ('0003_live_alert.sql'),
            ('0004_telemetry_v5_fields.sql'),
            ('0005_account_profile_terms.sql');
          '@
              $adoptionQuery = ($adoptionQuery -replace '[\r\n]+', ' ').Trim()
              npx.cmd wrangler d1 execute fivemcleaner-telemetry --remote --command $adoptionQuery
              if ($LASTEXITCODE -ne 0) { throw 'Adopting the historical telemetry schema failed.' }
            }
            # Wrangler captures a D1 backup after a successful migration apply.
            # This and the Worker deploy must finish before the app is public.
            npx.cmd wrangler d1 migrations apply fivemcleaner-telemetry --remote
            if ($LASTEXITCODE -ne 0) { throw 'Applying the telemetry migrations failed.' }
            npx.cmd wrangler d1 execute fivemcleaner-telemetry --remote --command "SELECT bug_code, process_count_at_start FROM telemetry_events LIMIT 1; SELECT terms_version FROM account_profiles LIMIT 1; SELECT message, active, updated_at FROM live_alert WHERE id = 1"
            if ($LASTEXITCODE -ne 0) { throw 'The post-migration D1 smoke test failed.' }
            npx.cmd wrangler deploy
            if ($LASTEXITCODE -ne 0) { throw 'Deploying the telemetry Worker failed.' }
          }
          finally { Pop-Location }
          ./scripts/Test-ProductionDiagnostics.ps1 -AppVersion $env:ASSET_VERSION

      - name: Publish versioned release artifacts to Vemryx
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare credentials are required to publish release artifacts.'
          }
          Push-Location ./infra/cloudflare-worker
          try {
            npm ci
            $protectedMaps = "Ralven-obfuscation-maps-$env:ASSET_VERSION.bin"
            npx.cmd wrangler r2 object put "ralven-releases/private/obfuscation-maps/$env:RELEASE_TAG/$protectedMaps" `
              --file "../../protected-maps/$protectedMaps" --remote
            if ($LASTEXITCODE -ne 0) { throw 'Preserving the encrypted diagnostic maps in R2 failed.' }
            $uploads = @{
              "Ralven-Setup-$env:ASSET_VERSION-win-x64.exe" = "Ralven-Setup-$env:ASSET_VERSION-win-x64.exe"
              "Ralven-Setup-$env:ASSET_VERSION-win-x64.exe.sha256" = "Ralven-Setup-$env:ASSET_VERSION-win-x64.exe.sha256"
              "Ralven-release-manifest-$env:ASSET_VERSION.json" = "Ralven-release-manifest-$env:ASSET_VERSION.json"
              'Ralven-win-x64.zip' = 'Ralven-win-x64.zip'
              'Ralven-win-x64.zip.sha256' = 'Ralven-win-x64.zip.sha256'
              'Ralven-Runtime-win-x64.zip' = "Ralven-Runtime-$env:ASSET_VERSION-win-x64.zip"
              'Ralven-Runtime-win-x64.zip.sha256' = "Ralven-Runtime-$env:ASSET_VERSION-win-x64.zip.sha256"
            }
            foreach ($entry in $uploads.GetEnumerator()) {
              npx.cmd wrangler r2 object put "ralven-releases/releases/$env:RELEASE_TAG/$($entry.Value)" `
                --file "../../release/$($entry.Key)" --remote
              if ($LASTEXITCODE -ne 0) { throw "Publishing '$($entry.Key)' to R2 failed." }
            }
          }
          finally { Pop-Location }

      - name: Deploy and verify the production dashboard
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRUSTED_COMMIT: ${{ needs.build_audit.outputs.trusted_commit }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare credentials are required to deploy the dashboard.'
          }
          $deployRoot = Join-Path $env:RUNNER_TEMP 'ralven-dashboard'
          New-Item -ItemType Directory -Path $deployRoot -Force | Out-Null
          Copy-Item -LiteralPath ./infra/dashboard/index.html -Destination $deployRoot
          Copy-Item -LiteralPath ./infra/dashboard/_headers -Destination $deployRoot
          Copy-Item -LiteralPath ./infra/dashboard/assets -Destination $deployRoot -Recurse
          @{ sourceCommit = $env:TRUSTED_COMMIT } |
            ConvertTo-Json -Compress |
            Set-Content -LiteralPath (Join-Path $deployRoot 'deployment.json') -Encoding utf8

          Push-Location ./infra/cloudflare-worker
          try {
            npx.cmd wrangler pages deploy $deployRoot --project-name=fivemcleaner-dashboard --branch=production
            if ($LASTEXITCODE -ne 0) { throw 'Deploying the production dashboard failed.' }
          }
          finally { Pop-Location }

          $verified = $false
          foreach ($attempt in 1..6) {
            try {
              $marker = Invoke-RestMethod `
                -Uri "https://dashboard.vemryx.com/deployment.json?source=$env:TRUSTED_COMMIT" `
                -Headers @{ 'Cache-Control' = 'no-cache' }
              if ($marker.sourceCommit -eq $env:TRUSTED_COMMIT) {
                $verified = $true
                break
              }
            }
            catch {
              Write-Host "Dashboard health check attempt $attempt failed: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 5
          }
          if (-not $verified) {
            throw 'The public dashboard did not serve the trusted release commit.'
          }

      - name: Create public release
        id: github_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_VERSION: ${{ needs.build_audit.outputs.asset_version }}
        run: |
          if (gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null) {
            Write-Host "Existing stable release found; resuming Vemryx feed publication."
            "created=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $arguments = @(
            'release', 'create', $env:RELEASE_TAG
          ) + @(
            '--repo', $env:GITHUB_REPOSITORY,
            '--verify-tag',
            '--title', "Ralven $env:RELEASE_TAG",
            '--notes-file', (Resolve-Path ./release/RELEASE_NOTES.md).Path,
            '--latest'
          )
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Creating the public GitHub Release failed.' }
          "created=true" >> $env:GITHUB_OUTPUT

      - name: Publish signed stable feed to Vemryx
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CLOUDFLARE_API_TOKEN) -or
              [string]::IsNullOrWhiteSpace($env:CLOUDFLARE_ACCOUNT_ID)) {
            throw 'Cloudflare credentials are required to publish the signed stable feed.'
          }
          Push-Location ./infra/cloudflare-worker
          try {
            npx.cmd wrangler r2 object put ralven-releases/stable/Ralven-Setup-latest-win-x64.exe `
              --file ../../release/Ralven-Setup-latest-win-x64.exe --remote
            if ($LASTEXITCODE -ne 0) { throw 'Publishing the stable installer alias failed.' }
            npx.cmd wrangler r2 object put ralven-releases/stable/runtime-manifest.json `
              --file ../../release/Ralven-runtime-update-manifest.json --remote
            if ($LASTEXITCODE -ne 0) { throw 'Publishing the runtime update feed failed.' }
            npx.cmd wrangler r2 object put ralven-releases/stable/installer-manifest.json `
              --file ../../release/Ralven-installer-update-manifest.json --remote
            if ($LASTEXITCODE -ne 0) { throw 'Publishing the installer update feed failed.' }
          }
          finally { Pop-Location }

          $feeds = @{
            'https://vemryx.com/Ralven/releases/runtime-manifest.json' = './release/Ralven-runtime-update-manifest.json'
            'https://vemryx.com/Ralven/releases/installer-manifest.json' = './release/Ralven-installer-update-manifest.json'
          }
          foreach ($entry in $feeds.GetEnumerator()) {
            $expected = (Get-Content -LiteralPath $entry.Value -Raw).Trim()
            $published = (Invoke-WebRequest -Uri $entry.Key -Headers @{ 'Cache-Control' = 'no-cache' }).Content.Trim()
            if ($published -ne $expected) {
              throw "The public update feed '$($entry.Key)' does not match the signed candidate."
            }
          }

      - name: Keep only the seven newest R2 releases
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node ./scripts/Prune-R2Releases.mjs
