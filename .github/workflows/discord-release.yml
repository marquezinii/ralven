name: Discord - anúncio de release

on:
  release:
    types: [published]
  repository_dispatch:
    types: [ralven-release-published]

permissions:
  contents: read

# A release criada pelo workflow usa repository_dispatch porque eventos gerados
# pelo GITHUB_TOKEN não iniciam outro workflow. Publicações manuais entram pelo
# evento release. Ambos só observam releases publicadas, nunca edições.
concurrency:
  group: discord-release-${{ github.event.release.id || github.event.client_payload.tag }}
  cancel-in-progress: false

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Resolver release publicada
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            jq '.release' "$GITHUB_EVENT_PATH" > release.json
          else
            tag="$(jq -r '.client_payload.tag // empty' "$GITHUB_EVENT_PATH")"
            [[ -n "$tag" ]] || { echo 'repository_dispatch sem tag de release.' >&2; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > release.json
          fi

          jq -e '.draft == false and .published_at != null' release.json > /dev/null || {
            echo 'O evento não referencia uma release publicada.' >&2
            exit 1
          }

          if [[ "$(jq -r '.prerelease' release.json)" == "true" ]]; then
            echo 'channel=beta' >> "$GITHUB_OUTPUT"
          else
            echo 'channel=stable' >> "$GITHUB_OUTPUT"
          fi

      - name: Gerar payload do Discord
        run: |
          python3 scripts/release/discord_release.py \
            --release release.json \
            --output discord-payloads.json

      - name: Publicar anúncio
        shell: bash
        env:
          CHANNEL: ${{ steps.release.outputs.channel }}
          DISCORD_STABLE_WEBHOOK: ${{ secrets.DISCORD_STABLE_WEBHOOK }}
          DISCORD_BETA_WEBHOOK: ${{ secrets.DISCORD_BETA_WEBHOOK }}
        run: |
          if [[ "$CHANNEL" == "stable" ]]; then
            webhook="$DISCORD_STABLE_WEBHOOK"
          else
            webhook="$DISCORD_BETA_WEBHOOK"
          fi
          [[ -n "$webhook" ]] || { echo "O secret DISCORD_${CHANNEL^^}_WEBHOOK não está configurado." >&2; exit 1; }
          separator='?'
          [[ "$webhook" == *'?'* ]] && separator='&'

          while IFS= read -r payload; do
            curl --fail-with-body --silent --show-error \
              --retry 2 --retry-all-errors \
              --header 'Content-Type: application/json' \
              --data "$payload" \
              "${webhook}${separator}wait=true" > /dev/null
          done < <(jq -c '.[]' discord-payloads.json)
